name: Build Windows exe

# Runs when you push a version tag, e.g.:  git tag v1.0.0 && git push --tags
# Builds Manga2CBZ.exe and attaches it to a GitHub release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # also allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q

      - name: Build exe
        run: |
          python -m pip install customtkinter pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name Manga2CBZ `
            --icon manga2cbz.ico `
            --add-data "manga2cbz.ico;." `
            --collect-data customtkinter `
            manga2cbz_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: Manga2CBZ-exe
          path: dist/Manga2CBZ.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Manga2CBZ.exe
          generate_release_notes: true
